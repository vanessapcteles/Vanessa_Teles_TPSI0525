<!DOCTYPE html>
<html lang="PT-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integrantes da Banda</title>
    <style>
        body {
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            background-color: #080808;
            color: #fdfbfb;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
            font-size: 20px;
            background-image: url("../img/wallpaper_integ.jpg");
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: absolute;
            background-position: top;
        }
        h2 {
            text-align: center;
            color: #ffffff;
            font-size: 40px;
            margin-top: 20px;
            font-style: oblique;
        }
        p {
            font-size: 28px;
            color: #ffffff;
            text-align: center;
        }
        a {
            color: #fffcfc;
            text-decoration: none;
            font-size: 20px;
            display: block; 
            text-align: center;
            margin-top: 40px;
        }
        img {
            display: block;
            margin: 20px auto;
            border-radius: 20px;
            width: 400px; 
            height: auto; /* Mantém a proporção da imagem */
            size-adjust: 100%;
        }
        div {
            text-align: center;
            margin: 20px auto;
            padding: 20px;
            background-color: #0000003d;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 50%;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        div:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <h2>Integrantes</h2>

    <p style="text-align: center;">A banda é composta por:</p>

    <div>
        <img src="../img/oli.jpg" alt="Oliver Sykes">
        <p>Oliver Sykes - Vocal</p>
    </div>

    <div>
        <img src="../img/malia.jpg" alt="Malia">
        <p>Malia - Guitarra</p>
    </div>

    <div>
        <img src="../img/matt.JPG" alt="Matt Kean">
        <p>Matt Kean - Baixo</p>
    </div>

    <div>
        <img src="../img/nicholls.jpg" alt="Matt Nicholls">
        <p>Matt Nicholls - Bateria</p>
    </div>

    <div>
        <img src="../img/jordan.jpg" alt="Jordan Fish">
        <p>Jordan Fish - Teclados e Programação</p>
    </div>
    
    <a href="../index.html">Voltar ao Início</a>
</body>
</html>

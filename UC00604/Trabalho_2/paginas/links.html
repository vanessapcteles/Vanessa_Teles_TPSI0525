        }

            display: flex;

        }
        div {
            text-align: center;
            margin: 20px auto;
            padding: 20px;
            background-color: #00000033;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 50%;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        div:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }

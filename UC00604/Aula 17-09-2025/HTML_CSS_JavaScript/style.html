<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style Animation</title>
    <style>
        #bot1{
            width: 100px;
            height: 100px;
            background-color: red;
        }
    </style>
</head>
<body>
    <button id="bot1">Isto é fixe!</button>
    <script>
        function changeColor(){
            const botao=document.getElementById('bot1');
            const colors="#"+Math.floor(Math.random()*16777215).toString(16);
            botao.style.backgroundColor=colors;
            console.log(colors);
        };
            setInterval(changeColor,1000);

    </script>
</body>
</html>
